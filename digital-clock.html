<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Digital Clock - Multi TimeZone</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            width: 100%;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 50px;
            animation: slideDown 0.8s ease-out;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .header p {
            font-size: 1rem;
            opacity: 0.9;
            letter-spacing: 1px;
        }

        .clocks-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            margin-bottom: 40px;
        }

        .clock-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
            animation: fadeInUp 0.8s ease-out forwards;
            opacity: 0;
        }

        .clock-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.4);
        }

        .clock-card:nth-child(1) { animation-delay: 0.1s; }
        .clock-card:nth-child(2) { animation-delay: 0.2s; }
        .clock-card:nth-child(3) { animation-delay: 0.3s; }
        .clock-card:nth-child(4) { animation-delay: 0.4s; }
        .clock-card:nth-child(5) { animation-delay: 0.5s; }
        .clock-card:nth-child(6) { animation-delay: 0.6s; }
        .clock-card:nth-child(7) { animation-delay: 0.7s; }
        .clock-card:nth-child(8) { animation-delay: 0.8s; }

        .timezone-name {
            font-size: 1.3rem;
            font-weight: 700;
            color: #667eea;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .timezone-flag {
            font-size: 1.8rem;
        }

        .timezone-info {
            font-size: 0.85rem;
            color: #999;
            margin-bottom: 15px;
            font-weight: 500;
        }

        .digital-clock {
            font-family: 'Courier New', monospace;
            font-size: 2.5rem;
            font-weight: bold;
            color: #333;
            text-align: center;
            letter-spacing: 2px;
            margin-bottom: 15px;
            line-height: 1.2;
        }

        .time {
            color: #667eea;
        }

        .period {
            font-size: 1.2rem;
            color: #764ba2;
            margin-left: 8px;
        }

        .date-display {
            text-align: center;
            font-size: 0.95rem;
            color: #666;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 2px solid #f0f0f0;
        }

        .day-name {
            font-weight: 600;
            color: #764ba2;
            margin-bottom: 5px;
        }

        .separator {
            text-align: center;
            margin-bottom: 40px;
        }

        .separator-line {
            height: 3px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.5), transparent);
            border-radius: 2px;
        }

        .controls {
            text-align: center;
            margin-top: 40px;
        }

        .btn-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 2px solid white;
            padding: 12px 28px;
            font-size: 1rem;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        button:hover {
            background: rgba(255, 255, 255, 0.4);
            transform: scale(1.05);
        }

        button:active {
            transform: scale(0.98);
        }

        .format-toggle {
            background: rgba(255, 255, 255, 0.3);
        }

        .format-toggle.active {
            background: rgba(255, 255, 255, 0.6);
        }

        /* Animations */
        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.7;
            }
        }

        .blink {
            animation: pulse 1s infinite;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .header h1 {
                font-size: 2rem;
            }

            .digital-clock {
                font-size: 2rem;
            }

            .clocks-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }

            .clock-card {
                padding: 25px;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 10px;
            }

            .header h1 {
                font-size: 1.5rem;
            }

            .header p {
                font-size: 0.9rem;
            }

            .digital-clock {
                font-size: 1.8rem;
                letter-spacing: 1px;
            }

            .timezone-name {
                font-size: 1.1rem;
            }

            .clock-card {
                padding: 20px;
            }

            .btn-group {
                gap: 10px;
            }

            button {
                padding: 10px 20px;
                font-size: 0.9rem;
            }
        }

        .timezone-offset {
            font-size: 0.85rem;
            color: #764ba2;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🌍 Global Digital Clock</h1>
            <p>Real-time across multiple time zones</p>
        </div>

        <div class="clocks-grid" id="clocksContainer">
            <!-- Clocks will be generated here by JavaScript -->
        </div>

        <div class="separator">
            <div class="separator-line"></div>
        </div>

        <div class="controls">
            <div class="btn-group">
                <button class="format-toggle active" data-format="12">12-Hour Format</button>
                <button class="format-toggle" data-format="24">24-Hour Format</button>
                <button onclick="addNewTimezone()">➕ Add Timezone</button>
                <button onclick="resetToDefault()">🔄 Reset</button>
            </div>
        </div>
    </div>

    <script>
        // Default timezones with flags
        const defaultTimezones = [
            { name: 'New York', timezone: 'America/New_York', flag: '🇺🇸' },
            { name: 'London', timezone: 'Europe/London', flag: '🇬🇧' },
            { name: 'Tokyo', timezone: 'Asia/Tokyo', flag: '🇯🇵' },
            { name: 'Sydney', timezone: 'Australia/Sydney', flag: '🇦🇺' },
            { name: 'Dubai', timezone: 'Asia/Dubai', flag: '🇦🇪' },
            { name: 'Singapore', timezone: 'Asia/Singapore', flag: '🇸🇬' },
            { name: 'Paris', timezone: 'Europe/Paris', flag: '🇫🇷' },
            { name: 'India (IST)', timezone: 'Asia/Kolkata', flag: '🇮🇳' }
        ];

        let currentTimezones = [...defaultTimezones];
        let is24HourFormat = false;

        // Format time with leading zeros
        function padZero(num) {
            return num.toString().padStart(2, '0');
        }

        // Get time for specific timezone
        function getTimeInTimezone(timezone) {
            const now = new Date();
            const formatter = new Intl.DateTimeFormat('en-US', {
                timeZone: timezone,
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: true
            });

            const parts = formatter.formatToParts(now);
            const result = {};
            
            parts.forEach(part => {
                result[part.type] = part.value;
            });

            return result;
        }

        // Format time display
        function formatTime(timeParts) {
            let hours = parseInt(timeParts.hour);
            const minutes = timeParts.minute;
            const seconds = timeParts.second;
            const period = timeParts.dayPeriod;

            if (is24HourFormat) {
                // Convert to 24-hour format
                if (period === 'PM' && hours !== 12) {
                    hours += 12;
                } else if (period === 'AM' && hours === 12) {
                    hours = 0;
                }
                return `${padZero(hours)}:${minutes}:${seconds}`;
            } else {
                return `${padZero(hours)}:${minutes}:${seconds} ${period}`;
            }
        }

        // Get timezone offset
        function getTimezoneOffset(timezone) {
            const now = new Date();
            const utcDate = new Date(now.toLocaleString('en-US', { timeZone: 'UTC' }));
            const tzDate = new Date(now.toLocaleString('en-US', { timeZone: timezone }));
            const offset = (tzDate - utcDate) / (1000 * 60 * 60);
            const sign = offset >= 0 ? '+' : '';
            return `UTC ${sign}${offset.toFixed(1)}`;
        }

        // Get day name
        function getDayName(timezone) {
            const now = new Date();
            const formatter = new Intl.DateTimeFormat('en-US', {
                timeZone: timezone,
                weekday: 'long',
                month: 'short',
                day: 'numeric'
            });
            return formatter.format(now);
        }

        // Create clock card HTML
        function createClockCard(tzData) {
            const timeParts = getTimeInTimezone(tzData.timezone);
            const timeString = formatTime(timeParts);
            const offset = getTimezoneOffset(tzData.timezone);
            const dayName = getDayName(tzData.timezone);

            return `
                <div class="clock-card">
                    <div class="timezone-name">
                        <span class="timezone-flag">${tzData.flag}</span>
                        <span>${tzData.name}</span>
                    </div>
                    <div class="timezone-info">
                        <div class="timezone-offset">${offset}</div>
                    </div>
                    <div class="digital-clock">
                        <span class="time">${timeString}</span>
                    </div>
                    <div class="date-display">
                        <div class="day-name">${dayName}</div>
                    </div>
                </div>
            `;
        }

        // Update all clocks
        function updateClocks() {
            const container = document.getElementById('clocksContainer');
            container.innerHTML = currentTimezones.map(tz => createClockCard(tz)).join('');
        }

        // Format toggle
        document.querySelectorAll('.format-toggle').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.format-toggle').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                is24HourFormat = this.dataset.format === '24';
                updateClocks();
            });
        });

        // Add new timezone
        function addNewTimezone() {
            const allTimezones = [
                { name: 'Los Angeles', timezone: 'America/Los_Angeles', flag: '🇺🇸' },
                { name: 'Chicago', timezone: 'America/Chicago', flag: '🇺🇸' },
                { name: 'Toronto', timezone: 'America/Toronto', flag: '🇨🇦' },
                { name: 'Mexico City', timezone: 'America/Mexico_City', flag: '🇲🇽' },
                { name: 'São Paulo', timezone: 'America/Sao_Paulo', flag: '🇧🇷' },
                { name: 'Buenos Aires', timezone: 'America/Argentina/Buenos_Aires', flag: '🇦🇷' },
                { name: 'Berlin', timezone: 'Europe/Berlin', flag: '🇩🇪' },
                { name: 'Moscow', timezone: 'Europe/Moscow', flag: '🇷🇺' },
                { name: 'Istanbul', timezone: 'Europe/Istanbul', flag: '🇹🇷' },
                { name: 'Bangkok', timezone: 'Asia/Bangkok', flag: '🇹🇭' },
                { name: 'Hong Kong', timezone: 'Asia/Hong_Kong', flag: '🇭🇰' },
                { name: 'Seoul', timezone: 'Asia/Seoul', flag: '🇰🇷' },
                { name: 'Shanghai', timezone: 'Asia/Shanghai', flag: '🇨🇳' },
                { name: 'Auckland', timezone: 'Pacific/Auckland', flag: '🇳🇿' }
            ];

            const notAdded = allTimezones.filter(tz => 
                !currentTimezones.find(ctz => ctz.timezone === tz.timezone)
            );

            if (notAdded.length === 0) {
                alert('All timezones are already added!');
                return;
            }

            const randomTz = notAdded[Math.floor(Math.random() * notAdded.length)];
            currentTimezones.push(randomTz);
            updateClocks();
        }

        // Reset to default
        function resetToDefault() {
            currentTimezones = [...defaultTimezones];
            is24HourFormat = false;
            document.querySelectorAll('.format-toggle').forEach(b => b.classList.remove('active'));
            document.querySelector('[data-format="12"]').classList.add('active');
            updateClocks();
        }

        // Initialize
        updateClocks();
        setInterval(updateClocks, 1000);
    </script>
</body>
</html>
